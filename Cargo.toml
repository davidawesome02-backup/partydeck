[package]
name = "partydeck"
version = "0.8.5"
edition = "2024"

[dependencies]
gamescope_webrtc = { path = "deps/gamescope_webrtc" }

dialog = "0.3.0"
eframe = { version = "0.32.1", features = ["x11", "wayland", "accesskit", "default_fonts", "glow"], default-features = false}
egui_extras = { version = "0.32.1", features = ["file", "image"], default-features = false }
evdev = "=0.13.0"
fastrand = "2.3.0"
image = { version = "0.25.8", features = ["png"], default-features = false }
reqwest = { version = "0.12.15", features = ["blocking", "json"] }
rfd = "0.15.3"
serde = "1.0.219"
serde_json = "1.0.140"
walkdir = "2.5.0"
x11rb = { version = "0.13.1", default-features = false }
zbus = { version = "5.5.0", features = ["async-io", "blocking-api"], default-features = false }
steamlocate = "2.0.1"
zip = { version = "5.1.1", features = ["deflate", "deflate64"], default-features = false }
pathsearch = "0.2.0"
nix = { version = "0.30.1", default-features = false, features = ["poll", "fs", "signal"] }

wayland-client = "0.31.11"
wayland-scanner = "0.31.7"
wayland-backend = "0.3.11"