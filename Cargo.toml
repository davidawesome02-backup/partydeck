[package]
name = "partydeck"
version = "0.8.5"
edition = "2024"

[features]
default = []
download_deps = ["dep:reqwest", "dep:serde_json", "dep:tar", "dep:bzip2", "dep:sevenz-rust2", "dep:sha2"]
download_deps_latest = ["download_deps"]
build_gamescope = []

[dependencies]
dialog = "0.3.0"
eframe = { version = "0.34.3", features = ["x11", "wayland", "default_fonts", "glow"], default-features = false}
egui_extras = { version = "0.34.3", features = ["file", "image"], default-features = false }
evdev = "=0.13.0"
fastrand = "2.3.0"
image = { version = "0.25.8", features = ["jpeg", "png"], default-features = false }
reqwest = { version = "0.12.15", features = ["blocking", "json"] }
rfd = "0.15.3"
serde = "1.0.219"
serde_json = "1.0.140"
x11rb = { version = "0.13.1", default-features = false }
zbus = { version = "5.5.0", features = ["async-io", "blocking-api"], default-features = false }
steamlocate = "2.0.1"
zip = { version = "5.1.1", features = ["deflate", "deflate64"], default-features = false }
pathsearch = "0.2.0"
tokio = { version = "1", features = ["full"] }

nix = { version = "0.30.1", default-features = false, features = ["poll", "fs", "signal"] }

wayland-client = "0.31.11"
wayland-scanner = "0.31.7"
wayland-backend = "0.3.11"

egui-winit = { version = "0.34.3", features = ["x11", "wayland"], default-features = false }
glutin = "0.32"
glutin-winit = { version = "0.5", features = ["egl", "x11", "wayland"], default-features = false}
khronos-egl = { version = "6", features = ["dynamic"] }
pipewire = "0.10"


# [patch.crates-io]
# eframe = { path = "deps/egui/crates/eframe" }
# egui = { path = "deps/egui/crates/egui" }
# egui_glow = { path = "deps/egui/crates/egui_glow" }
# egui-winit = { path = "deps/egui/crates/egui-winit" }


[build-dependencies]
reqwest = { version = "0.12.15", features = ["blocking", "json"], optional = true }
serde_json = { version = "1.0.140", optional = true }
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.6.1", optional = true }
sevenz-rust2 = { version = "0.20.2", features = ["util"], default-features = false, optional = true }
sha2 = { version = "0.10.9", optional = true}
